<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CreativeTemplatezCo Editor</title>

    <link rel="stylesheet" href="styles.css">

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #eeeae4;
            color: #171717;
            font-family: "DM Sans", sans-serif;
            overflow: hidden;
        }

        .editor-header {
            min-height: 64px;
            background: #111111;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 20px;
        }

        .editor-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        .editor-brand-mark {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: linear-gradient(135deg, #ffffff, #b8b0a5);
            color: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        .editor-brand-name {
            font-size: 16px;
        }

        .editor-actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .editor-button {
            border: 1px solid #555555;
            background: transparent;
            color: white;
            border-radius: 8px;
            padding: 9px 13px;
            cursor: pointer;
            font-family: inherit;
        }

        .editor-button.primary {
            background: white;
            color: #111111;
            border-color: white;
        }

        .editor-layout {
            height: calc(100vh - 64px);
            display: grid;
            grid-template-columns: 220px 1fr 250px;
        }

        .editor-sidebar {
            background: #f8f6f2;
            border-right: 1px solid #ddd8d0;
            padding: 18px;
            overflow-y: auto;
        }

        .editor-sidebar.right {
            border-right: 0;
            border-left: 1px solid #ddd8d0;
        }

        .sidebar-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            color: #77716a;
        }

        .tool-button {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid #ddd8d0;
            background: white;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }

        .tool-button:active {
            transform: scale(0.98);
        }

        .tool-icon {
            display: inline-block;
            width: 25px;
            font-weight: 700;
        }

        .property-group {
            margin-bottom: 18px;
        }

        .property-label {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 7px;
            color: #77716a;
        }

        .property-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d7d1c8;
            border-radius: 8px;
            background: white;
            font-family: inherit;
            font-size: 14px;
        }

        .property-input:focus {
            outline: 2px solid #6d5dfc;
            outline-offset: 1px;
        }

        .canvas-area {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            overflow: auto;
            background:
                radial-gradient(#d7d1c8 1px, transparent 1px);
            background-size: 18px 18px;
        }

        .canvas-wrapper {
            width: 700px;
            height: 500px;
            min-width: 700px;
            min-height: 500px;
            box-shadow: 0 20px 50px rgba(0,0,0,.12);
        }

        .design-canvas {
            position: relative;
            width: 700px;
            height: 500px;
            background: white;
            overflow: hidden;
        }

        .canvas-title {
            position: absolute;
            left: 80px;
            top: 100px;
            font-family: "Playfair Display", serif;
            font-size: 52px;
            font-weight: 600;
            cursor: move;
            user-select: none;
        }

        .canvas-subtitle {
            position: absolute;
            left: 85px;
            top: 175px;
            width: 360px;
            font-size: 18px;
            line-height: 1.6;
            color: #66615b;
            cursor: move;
            user-select: none;
        }

        .canvas-orb {
            position: absolute;
            right: 80px;
            top: 90px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, #171717, #77716a);
            cursor: move;
            user-select: none;
        }

        .canvas-badge {
            position: absolute;
            left: 85px;
            bottom: 70px;
            padding: 9px 15px;
            border: 1px solid #222222;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: move;
            user-select: none;
        }

        .selected {
            outline: 2px solid #6d5dfc;
            outline-offset: 3px;
        }

        .empty-selection {
            color: #77716a;
            font-size: 14px;
            line-height: 1.6;
        }

        .selected-label {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        @media (max-width: 800px) {

            body {
                overflow: auto;
            }

            .editor-header {
                flex-direction: column;
                align-items: stretch;
            }

            .editor-actions {
                justify-content: flex-start;
            }

            .editor-layout {
                height: auto;
                min-height: calc(100vh - 120px);
                display: flex;
                flex-direction: column;
            }

            .editor-sidebar,
            .editor-sidebar.right {
                border: 0;
                border-bottom: 1px solid #ddd8d0;
            }

            .editor-sidebar {
                padding: 12px;
            }

            .tool-button {
                width: auto;
                display: inline-block;
                margin-right: 5px;
            }

            .canvas-area {
                min-height: 560px;
                overflow-x: auto;
                justify-content: flex-start;
            }

            .editor-sidebar.right {
                border-top: 1px solid #ddd8d0;
            }
        }
    </style>
</head>

<body>

<header class="editor-header">

    <div class="editor-brand">
        <div class="editor-brand-mark">C</div>
        <div class="editor-brand-name">
            CreativeTemplatezCo
        </div>
    </div>

    <div class="editor-actions">

        <button
            class="editor-button"
            onclick="window.location.href='index.html'"
        >
            Exit
        </button>

        <button
            class="editor-button"
            onclick="undoAction()"
        >
            Undo
        </button>

        <button
            class="editor-button"
            onclick="redoAction()"
        >
            Redo
        </button>

        <button
            class="editor-button primary"
            onclick="saveDesign()"
        >
            Save
        </button>

    </div>

</header>


<div class="editor-layout">


    <!-- LEFT TOOLBAR -->

    <aside class="editor-sidebar">

        <div class="sidebar-title">
            Elements
        </div>

        <button
            class="tool-button"
            onclick="addText()"
        >
            <span class="tool-icon">T</span>
            Text
        </button>

        <button
            class="tool-button"
            onclick="addShape()"
        >
            <span class="tool-icon">○</span>
            Shape
        </button>

        <button
            class="tool-button"
            onclick="changeBackground()"
        >
            <span class="tool-icon">◐</span>
            Background
        </button>


        <div
            class="sidebar-title"
            style="margin-top:25px;"
        >
            Templates
        </div>


        <button
            class="tool-button"
            onclick="loadTemplate('brand')"
        >
            Modern Brand
        </button>

        <button
            class="tool-button"
            onclick="loadTemplate('marketing')"
        >
            Product Launch
        </button>

        <button
            class="tool-button"
            onclick="loadTemplate('event')"
        >
            Luxury Event
        </button>

    </aside>


    <!-- CANVAS -->

    <main class="canvas-area">

        <div class="canvas-wrapper">

            <div
                id="designCanvas"
                class="design-canvas"
            >

                <div
                    id="canvasTitle"
                    class="canvas-title"
                    style="left:80px; top:100px;"
                >
                    Your Brand
                </div>


                <div
                    id="canvasSubtitle"
                    class="canvas-subtitle"
                    style="left:85px; top:175px;"
                >
                    Create something beautiful with CreativeTemplatezCo.
                </div>


                <div
                    id="canvasOrb"
                    class="canvas-orb"
                ></div>


                <div
                    id="canvasBadge"
                    class="canvas-badge"
                >
                    CREATIVE TEMPLATE
                </div>

            </div>

        </div>

    </main>


    <!-- RIGHT PROPERTIES -->

    <aside class="editor-sidebar right">

        <div class="sidebar-title">
            Properties
        </div>

        <div id="propertyPanel">

            <div class="empty-selection">
                Select an element to edit it.
            </div>

        </div>

    </aside>

</div>


<script>

let selectedElement = null;

let history = [];

let historyPosition = -1;

let isDragging = false;

let dragOffsetX = 0;

let dragOffsetY = 0;


const canvas =
    document.getElementById(
        "designCanvas"
    );


const propertyPanel =
    document.getElementById(
        "propertyPanel"
    );


/* =========================
   SELECT
========================= */

function selectElement(element) {

    if (!element) {
        return;
    }


    selectedElement = element;


    document
        .querySelectorAll(
            "#designCanvas > *"
        )
        .forEach(function(el) {

            el.classList.remove(
                "selected"
            );

        });


    element.classList.add(
        "selected"
    );


    showProperties(
        element
    );
}


/* =========================
   PROPERTIES PANEL
========================= */

function showProperties(element) {

    if (!element) {

        propertyPanel.innerHTML = `
            <div class="empty-selection">
                Select an element to edit it.
            </div>
        `;

        return;
    }


    const currentText =
        element.innerText || "";


    const currentFontSize =
        parseInt(
            getComputedStyle(
                element
            ).fontSize
        ) || 20;


    propertyPanel.innerHTML = `

        <div class="selected-label">
            Selected Element
        </div>


        <div class="property-group">

            <div class="property-label">
                Text
            </div>

            <textarea
                id="textEditor"
                class="property-input"
                rows="5"
                placeholder="Enter your text..."
            ></textarea>

        </div>


        <div class="property-group">

            <div class="property-label">
                Font Size
            </div>

            <input
                id="fontSizeEditor"
                class="property-input"
                type="number"
                min="8"
                max="150"
                value="${currentFontSize}"
            >

        </div>


        <div class="property-group">

            <button
                id="duplicateButton"
                class="tool-button"
            >
                Duplicate
            </button>

            <button
                id="deleteButton"
                class="tool-button"
            >
                Delete
            </button>

        </div>

    `;


    const textEditor =
        document.getElementById(
            "textEditor"
        );


    const fontSizeEditor =
        document.getElementById(
            "fontSizeEditor"
        );


    const duplicateButton =
        document.getElementById(
            "duplicateButton"
        );


    const deleteButton =
        document.getElementById(
            "deleteButton"
        );


    textEditor.value =
        currentText;


    textEditor.addEventListener(
        "input",
        function() {

            if (!selectedElement) {
                return;
            }


            selectedElement.innerText =
                textEditor.value;

        }
    );


    textEditor.addEventListener(
        "change",
        function() {

            saveHistory();

        }
    );


    fontSizeEditor.addEventListener(
        "input",
        function() {

            if (!selectedElement) {
                return;
            }


            selectedElement.style.fontSize =
                fontSizeEditor.value +
                "px";

        }
    );


    fontSizeEditor.addEventListener(
        "change",
        function() {

            saveHistory();

        }
    );


    duplicateButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            duplicateElement();

        }
    );


    deleteButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            deleteElement();

        }
    );
}


/* =========================
   ADD TEXT
========================= */

function addText() {

    const text =
        document.createElement(
            "div"
        );


    text.innerText =
        "New Text";


    text.style.position =
        "absolute";


    text.style.left =
        "250px";


    text.style.top =
        "250px";


    text.style.fontSize =
        "28px";


    text.style.fontFamily =
        "DM Sans, sans-serif";


    text.style.cursor =
        "move";


    text.style.userSelect =
        "none";


    canvas.appendChild(
        text
    );


    makeEditable(
        text
    );


    selectElement(
        text
    );


    saveHistory();
}


/* =========================
   ADD SHAPE
========================= */

function addShape() {

    const shape =
        document.createElement(
            "div"
        );


    shape.style.position =
        "absolute";


    shape.style.left =
        "300px";


    shape.style.top =
        "300px";


    shape.style.width =
        "100px";


    shape.style.height =
        "100px";


    shape.style.background =
        "linear-gradient(135deg,#171717,#77716a)";


    shape.style.borderRadius =
        "20px";


    shape.style.cursor =
        "move";


    canvas.appendChild(
        shape
    );


    makeEditable(
        shape
    );


    selectElement(
        shape
    );


    saveHistory();
}


/* =========================
   EDITABLE
========================= */

function makeEditable(element) {

    element.style.cursor =
        "move";


    element.style.userSelect =
        "none";


    element.addEventListener(
        "mousedown",
        mouseDown
    );


    element.addEventListener(
        "touchstart",
        touchStart,
        {
            passive: false
        }
    );


    element.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            selectElement(
                element
            );

        }
    );
}


/* =========================
   MOUSE DOWN
========================= */

function mouseDown(event) {

    event.preventDefault();


    selectElement(
        this
    );


    isDragging = true;


    const rect =
        this.getBoundingClientRect();


    dragOffsetX =
        event.clientX -
        rect.left;


    dragOffsetY =
        event.clientY -
        rect.top;


    document.addEventListener(
        "mousemove",
        mouseMove
    );


    document.addEventListener(
        "mouseup",
        mouseUp
    );
}


/* =========================
   MOUSE MOVE
========================= */

function mouseMove(event) {

    if (
        !isDragging ||
        !selectedElement
    ) {
        return;
    }


    moveElement(
        event.clientX,
        event.clientY
    );
}


/* =========================
   MOUSE UP
========================= */

function mouseUp() {

    isDragging = false;


    document.removeEventListener(
        "mousemove",
        mouseMove
    );


    document.removeEventListener(
        "mouseup",
        mouseUp
    );


    saveHistory();
}


/* =========================
   TOUCH START
========================= */

function touchStart(event) {

    event.preventDefault();


    selectElement(
        this
    );


    const touch =
        event.touches[0];


    const rect =
        this.getBoundingClientRect();


    dragOffsetX =
        touch.clientX -
        rect.left;


    dragOffsetY =
        touch.clientY -
        rect.top;


    isDragging = true;


    document.addEventListener(
        "touchmove",
        touchMove,
        {
            passive: false
        }
    );


    document.addEventListener(
        "touchend",
        touchEnd
    );
}


/* =========================
   TOUCH MOVE
========================= */

function touchMove(event) {

    if (
        !isDragging ||
        !selectedElement
    ) {
        return;
    }


    event.preventDefault();


    const touch =
        event.touches[0];


    moveElement(
        touch.clientX,
        touch.clientY
    );
}


/* =========================
   TOUCH END
========================= */

function touchEnd() {

    isDragging = false;


    document.removeEventListener(
        "touchmove",
        touchMove
    );


    document.removeEventListener(
        "touchend",
        touchEnd
    );


    saveHistory();
}


/* =========================
   MOVE
========================= */

function moveElement(
    clientX,
    clientY
) {

    if (!selectedElement) {
        return;
    }


    const canvasRect =
        canvas.getBoundingClientRect();


    let x =
        clientX -
        canvasRect.left -
        dragOffsetX;


    let y =
        clientY -
        canvasRect.top -
        dragOffsetY;


    const maxX =
        canvas.clientWidth -
        selectedElement.offsetWidth;


    const maxY =
        canvas.clientHeight -
        selectedElement.offsetHeight;


    x =
        Math.max(
            0,
            Math.min(
                x,
                maxX
            )
        );


    y =
        Math.max(
            0,
            Math.min(
                y,
                maxY
            )
        );


    selectedElement.style.left =
        x + "px";


    selectedElement.style.top =
        y + "px";
}


/* =========================
   DELETE
========================= */

function deleteElement() {

    if (!selectedElement) {
        return;
    }


    selectedElement.remove();


    selectedElement =
        null;


    propertyPanel.innerHTML = `
        <div class="empty-selection">
            Select an element to edit it.
        </div>
    `;


    saveHistory();
}


/* =========================
   DUPLICATE
========================= */

function duplicateElement() {

    if (!selectedElement) {
        return;
    }


    const clone =
        selectedElement.cloneNode(
            true
        );


    const left =
        parseInt(
            selectedElement.style.left
        ) || 0;


    const top =
        parseInt(
            selectedElement.style.top
        ) || 0;


    clone.style.left =
        (left + 25) +
        "px";


    clone.style.top =
        (top + 25) +
        "px";


    canvas.appendChild(
        clone
    );


    makeEditable(
        clone
    );


    selectElement(
        clone
    );


    saveHistory();
}


/* =========================
   BACKGROUND
========================= */

function changeBackground() {

    const colour =
        prompt(
            "Enter a background colour:",
            "#ffffff"
        );


    if (!colour) {
        return;
    }


    canvas.style.background =
        colour;


    saveHistory();
}


/* =========================
   SAVE
========================= */

function saveDesign() {

    localStorage.setItem(
        "creativeTemplatezDesign",
        canvas.innerHTML
    );


    alert(
        "Design saved!"
    );
}


/* =========================
   HISTORY
========================= */

function saveHistory() {

    history =
        history.slice(
            0,
            historyPosition + 1
        );


    history.push(
        canvas.innerHTML
    );


    historyPosition =
        history.length - 1;
}


function undoAction() {

    if (
        historyPosition <= 0
    ) {
        return;
    }


    historyPosition--;


    restoreHistory();
}


function redoAction() {

    if (
        historyPosition >=
        history.length - 1
    ) {
        return;
    }


    historyPosition++;


    restoreHistory();
}


function restoreHistory() {

    canvas.innerHTML =
        history[
            historyPosition
        ];


    selectedElement =
        null;


    propertyPanel.innerHTML = `
        <div class="empty-selection">
            Select an element to edit it.
        </div>
    `;


    initialiseCanvas();
}


/* =========================
   TEMPLATES
========================= */

function loadTemplate(type) {

    if (type === "brand") {

        canvas.innerHTML = `

            <div
                class="canvas-title"
                style="
                    position:absolute;
                    left:100px;
                    top:100px;
                "
            >
                Your Brand
            </div>


            <div
                class="canvas-subtitle"
                style="
                    position:absolute;
                    left:100px;
                    top:175px;
                "
            >
                Build something beautiful.
            </div>


            <div
                class="canvas-orb"
                style="
                    position:absolute;
                    left:450px;
                    top:100px;
                "
            ></div>

        `;
    }


    if (type === "marketing") {

        canvas.innerHTML = `

            <div
                class="canvas-title"
                style="
                    position:absolute;
                    left:80px;
                    top:90px;
                "
            >
                NEW COLLECTION
            </div>


            <div
                class="canvas-subtitle"
                style="
                    position:absolute;
                    left:80px;
                    top:170px;
                "
            >
                Designed to stand out.
            </div>

        `;
    }


    if (type === "event") {

        canvas.innerHTML = `

            <div
                class="canvas-title"
                style="
                    position:absolute;
                    left:100px;
                    top:100px;
                "
            >
                SPECIAL EVENT
            </div>


            <div
                class="canvas-subtitle"
                style="
                    position:absolute;
                    left:100px;
                    top:175px;
                "
            >
                You are invited.
            </div>

        `;
    }


    initialiseCanvas();

    saveHistory();
}


/* =========================
   INITIALISE
========================= */

function initialiseCanvas() {

    document
        .querySelectorAll(
            "#designCanvas > *"
        )
        .forEach(function(element) {

            makeEditable(
                element
            );

        });
}


/* =========================
   START
========================= */

propertyPanel.innerHTML = `
    <div class="empty-selection">
        Select an element to edit it.
    </div>
`;


initialiseCanvas();

saveHistory();

</script>

</body>
</html>
