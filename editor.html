<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CreativeTemplatezCo Editor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eeeae4;
      color: #151515;
      font-family: "DM Sans", sans-serif;
      overflow: hidden;
    }

    .editor-header {
      height: 64px;
      background: #ffffff;
      border-bottom: 1px solid #e3ded7;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      position: relative;
      z-index: 10;
    }

    .editor-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
    }

    .editor-brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #151515;
      color: #ffffff;
      display: grid;
      place-items: center;
      font-family: "Playfair Display", serif;
      font-size: 17px;
    }

    .editor-brand-name {
      font-size: 15px;
    }

    .editor-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .editor-button {
      border: 1px solid #e3ded7;
      background: #ffffff;
      color: #151515;
      border-radius: 10px;
      padding: 10px 15px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .editor-button:hover {
      background: #f8f7f4;
    }

    .editor-button.primary {
      background: #151515;
      color: #ffffff;
      border-color: #151515;
    }

    .editor-layout {
      height: calc(100vh - 64px);
      display: grid;
      grid-template-columns: 230px 1fr 260px;
    }

    .editor-sidebar {
      background: #ffffff;
      border-right: 1px solid #e3ded7;
      padding: 20px;
      overflow-y: auto;
    }

    .editor-sidebar.right {
      border-right: none;
      border-left: 1px solid #e3ded7;
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #77736d;
      margin-bottom: 15px;
    }

    .tool-button {
      width: 100%;
      padding: 13px 12px;
      margin-bottom: 8px;
      border: 1px solid #e3ded7;
      background: #ffffff;
      border-radius: 10px;
      text-align: left;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .tool-button:hover {
      background: #f8f7f4;
      border-color: #cfc8c0;
    }

    .tool-icon {
      display: inline-block;
      width: 24px;
    }

    .property-group {
      margin-bottom: 25px;
    }

    .property-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #77736d;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .property-input {
      width: 100%;
      border: 1px solid #e3ded7;
      border-radius: 9px;
      padding: 10px;
      font-family: inherit;
      background: #ffffff;
    }

    .color-row {
      display: flex;
      gap: 8px;
    }

    .color-input {
      width: 48px;
      height: 42px;
      border: 1px solid #e3ded7;
      border-radius: 9px;
      padding: 3px;
      background: #ffffff;
      cursor: pointer;
    }

    .canvas-area {
      position: relative;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px;
      background:
        radial-gradient(circle at 1px 1px, rgba(21,21,21,0.08) 1px, transparent 0);
      background-size: 24px 24px;
    }

    .canvas-wrapper {
      position: relative;
      width: 700px;
      height: 500px;
      flex-shrink: 0;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
    }

    .design-canvas {
      width: 100%;
      height: 100%;
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    .canvas-title {
      position: absolute;
      left: 55px;
      top: 65px;
      font-family: "Playfair Display", serif;
      font-size: 48px;
      line-height: 1.05;
      max-width: 520px;
      cursor: move;
      user-select: none;
    }

    .canvas-subtitle {
      position: absolute;
      left: 58px;
      top: 185px;
      max-width: 430px;
      font-size: 17px;
      line-height: 1.6;
      color: #77736d;
      cursor: move;
      user-select: none;
    }

    .canvas-orb {
      position: absolute;
      width: 180px;
      height: 180px;
      right: 55px;
      bottom: 45px;
      border-radius: 50%;
      background: linear-gradient(135deg, #eadcff, #b78cff);
      cursor: move;
    }

    .canvas-badge {
      position: absolute;
      left: 58px;
      bottom: 48px;
      padding: 9px 14px;
      border-radius: 30px;
      background: #151515;
      color: #ffffff;
      font-size: 11px;
      letter-spacing: 0.12em;
      font-weight: 700;
      cursor: move;
      user-select: none;
    }

    .selected {
      outline: 2px solid #b78cff;
      outline-offset: 5px;
    }

    .empty-selection {
      font-size: 14px;
      color: #77736d;
      line-height: 1.6;
    }

    @media (max-width: 900px) {
      .editor-layout {
        grid-template-columns: 180px 1fr;
      }

      .editor-sidebar.right {
        display: none;
      }

      .canvas-wrapper {
        width: 600px;
        height: 430px;
      }
    }

    @media (max-width: 650px) {
      .editor-layout {
        grid-template-columns: 1fr;
      }

      .editor-sidebar {
        display: none;
      }

      .canvas-area {
        padding: 20px;
      }

      .canvas-wrapper {
        transform: scale(0.72);
        transform-origin: center center;
        margin: -70px;
      }

      .editor-brand-name {
        display: none;
      }
    }
  </style>
</head>

<body>

  <header class="editor-header">

    <div class="editor-brand">
      <div class="editor-brand-mark">C</div>
      <div class="editor-brand-name">
        CreativeTemplatezCo
      </div>
    </div>

    <div class="editor-actions">
      <button class="editor-button" onclick="window.location.href='index.html'">
        Exit
      </button>

      <button class="editor-button" onclick="undoAction()">
        Undo
      </button>

      <button class="editor-button" onclick="redoAction()">
        Redo
      </button>

      <button class="editor-button primary" onclick="saveDesign()">
        Save Design
      </button>
    </div>

  </header>


  <main class="editor-layout">

    <!-- LEFT TOOLBAR -->

    <aside class="editor-sidebar">

      <div class="sidebar-title">
        Add
      </div>

      <button class="tool-button" onclick="addText()">
        <span class="tool-icon">T</span>
        Text
      </button>

      <button class="tool-button" onclick="addShape()">
        <span class="tool-icon">◇</span>
        Shape
      </button>

      <button class="tool-button" onclick="changeBackground()">
        <span class="tool-icon">◼</span>
        Background
      </button>

      <div class="sidebar-title" style="margin-top:30px;">
        Template
      </div>

      <button class="tool-button" onclick="loadTemplate('brand')">
        Modern Brand
      </button>

      <button class="tool-button" onclick="loadTemplate('marketing')">
        Product Launch
      </button>

      <button class="tool-button" onclick="loadTemplate('event')">
        Luxury Event
      </button>

    </aside>


    <!-- CANVAS -->

    <section class="canvas-area">

      <div class="canvas-wrapper">

        <div id="designCanvas" class="design-canvas">

          <div
            id="canvasTitle"
            class="canvas-title"
            onclick="selectElement(this)"
          >
            Your Brand
          </div>

          <div
            id="canvasSubtitle"
            class="canvas-subtitle"
            onclick="selectElement(this)"
          >
            Create something beautiful with CreativeTemplatezCo.
          </div>

          <div
            id="canvasOrb"
            class="canvas-orb"
            onclick="selectElement(this)"
          ></div>

          <div
            id="canvasBadge"
            class="canvas-badge"
            onclick="selectElement(this)"
          >
            CREATIVE TEMPLATE
          </div>

        </div>

      </div>

    </section>


    <!-- RIGHT PROPERTIES -->

    <aside class="editor-sidebar right">

      <div class="sidebar-title">
        Properties
      </div>

      <div id="propertyPanel">

        <p class="empty-selection">
          Select an element on the canvas to edit its properties.
        </p>

      </div>

    </aside>

  </main>


  <script>

    let selectedElement = null;

    let history = [];
    let historyPosition = -1;


    function selectElement(element) {

      if (selectedElement) {
        selectedElement.classList.remove("selected");
      }

      selectedElement = element;

      selectedElement.classList.add("selected");

      showProperties(element);

    }


    function showProperties(element) {

      const panel = document.getElementById("propertyPanel");

      const currentColor =
        getComputedStyle(element).color || "#151515";

      panel.innerHTML = `

        <div class="property-group">

          <label class="property-label">
            Text
          </label>

          <input
            class="property-input"
            type="text"
            value="${element.innerText || ""}"
            oninput="updateText(this.value)"
          >

        </div>


        <div class="property-group">

          <label class="property-label">
            Font Size
          </label>

          <input
            class="property-input"
            type="number"
            value="${parseInt(getComputedStyle(element).fontSize)}"
            oninput="updateFontSize(this.value)"
          >

        </div>


        <div class="property-group">

          <label class="property-label">
            Text Colour
          </label>

          <div class="color-row">

            <input
              class="color-input"
              type="color"
              value="${rgbToHex(currentColor)}"
              onchange="updateTextColor(this.value)"
            >

          </div>

        </div>

      `;
    }


    function updateText(value) {

      if (!selectedElement) return;

      selectedElement.innerText = value;

      saveHistory();

    }


    function updateFontSize(value) {

      if (!selectedElement) return;

      selectedElement.style.fontSize = value + "px";

      saveHistory();

    }


    function updateTextColor(value) {

      if (!selectedElement) return;

      selectedElement.style.color = value;

      saveHistory();

    }


    function addText() {

      const canvas = document.getElementById("designCanvas");

      const text = document.createElement("div");

      text.innerText = "New Text";

      text.style.position = "absolute";
      text.style.left = "250px";
      text.style.top = "250px";
      text.style.fontSize = "28px";
      text.style.fontFamily = '"DM Sans", sans-serif';
      text.style.cursor = "move";
      text.style.userSelect = "none";

      text.onclick = function() {
        selectElement(this);
      };

      canvas.appendChild(text);

      selectElement(text);

      saveHistory();

    }


    function addShape() {

      const canvas = document.getElementById("designCanvas");

      const shape = document.createElement("div");

      shape.style.position = "absolute";
      shape.style.left = "300px";
      shape.style.top = "300px";
      shape.style.width = "100px";
      shape.style.height = "100px";
      shape.style.background = "#b78cff";
      shape.style.borderRadius = "20px";
      shape.style.cursor = "move";

      shape.onclick = function() {
        selectElement(this);
      };

      canvas.appendChild(shape);

      selectElement(shape);

      saveHistory();

    }


    function changeBackground() {

      const colour = prompt(
        "Enter a background colour:",
        "#ffffff"
      );

      if (!colour) return;

      document.getElementById(
        "designCanvas"
      ).style.background = colour;

      saveHistory();

    }


    function saveDesign() {

      const canvas =
        document.getElementById("designCanvas");

      localStorage.setItem(
        "creativeTemplatezDesign",
        canvas.innerHTML
      );

      alert("Design saved!");

    }


    function saveHistory() {

      const canvas =
        document.getElementById("designCanvas");

      history =
        history.slice(0, historyPosition + 1);

      history.push(canvas.innerHTML);

      historyPosition++;

    }


    function undoAction() {

      if (historyPosition <= 0) return;

      historyPosition--;

      document.getElementById(
        "designCanvas"
      ).innerHTML = history[historyPosition];

    }


    function redoAction() {

      if (
        historyPosition >= history.length - 1
      ) return;

      historyPosition++;

      document.getElementById(
        "designCanvas"
      ).innerHTML = history[historyPosition];

    }


    function loadTemplate(type) {

      const canvas =
        document.getElementById("designCanvas");

      if (type === "brand") {

        canvas.style.background = "#ffffff";

        canvas.innerHTML = `
          <div
            class="canvas-title"
            onclick="selectElement(this)"
          >
            Modern Brand
          </div>

          <div
            class="canvas-subtitle"
            onclick="selectElement(this)"
          >
            A premium visual identity template.
          </div>

          <div
            class="canvas-orb"
            onclick="selectElement(this)"
          ></div>

          <div
            class="canvas-badge"
            onclick="selectElement(this)"
          >
            BRAND KIT
          </div>
        `;

      }


      if (type === "marketing") {

        canvas.style.background = "#f8f7f4";

        canvas.innerHTML = `
          <div
            class="canvas-title"
            onclick="selectElement(this)"
          >
            New Collection
          </div>

          <div
            class="canvas-subtitle"
            onclick="selectElement(this)"
          >
            Launch your next product with confidence.
          </div>

          <div
            class="canvas-orb"
            onclick="selectElement(this)"
          ></div>

          <div
            class="canvas-badge"
            onclick="selectElement(this)"
          >
            SHOP NOW
          </div>
        `;

      }


      if (type === "event") {

        canvas.style.background = "#151515";

        canvas.innerHTML = `
          <div
            class="canvas-title"
            style="color:white;"
            onclick="selectElement(this)"
          >
            An Evening
          </div>

          <div
            class="canvas-subtitle"
            style="color:#ccc;"
            onclick="selectElement(this)"
          >
            Join us for an unforgettable celebration.
          </div>

          <div
            class="canvas-orb"
            onclick="selectElement(this)"
          ></div>

          <div
            class="canvas-badge"
            onclick="selectElement(this)"
          >
            YOU'RE INVITED
          </div>
        `;

      }

      selectedElement = null;

      document.getElementById(
        "propertyPanel"
      ).innerHTML = `
        <p class="empty-selection">
          Select an element on the canvas to edit its properties.
        </p>
      `;

      saveHistory();

    }


    function rgbToHex(rgb) {

      if (!rgb) return "#151515";

      if (rgb.startsWith("#")) {
        return rgb;
      }

      const result =
        rgb.match(/\d+/g);

      if (!result) return "#151515";

      return "#" + result
        .slice(0, 3)
        .map(x =>
          parseInt(x)
            .toString(16)
            .padStart(2, "0")
        )
        .join("");

    }


    // Start history with the current design.
    saveHistory();

  </script>

</body>
</html>
